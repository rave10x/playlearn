[package]
name = "playlearn-core"
version = "1.5.0"
edition = "2021"
description = "Playlearn backend: storage, yt-dlp, downloads, backups, local HTTP API"
license = "MIT"

[dependencies]
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false }
open = "5"
rand = "0.8"
regex = "1"
url = "2"
rust-embed = "8"
dirs = "5"
percent-encoding = "2"

[[bin]]
name = "playlearn-server"
path = "src/bin/server.rs"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
